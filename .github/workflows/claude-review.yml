name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          prompt: |
            Revisa este Pull Request exhaustivamente con contexto completo del codebase.

            Para cada problema encontrado, comenta directamente en la línea de código afectada con:
            - Qué está mal y por qué
            - Cómo corregirlo (con ejemplo de código si aplica)
            - Severidad: 🔴 Crítico / 🟡 Importante / 🔵 Sugerencia

            Revisa específicamente:
            1. Bugs y errores de lógica
            2. Vulnerabilidades de seguridad (inyecciones, auth, datos expuestos)
            3. Violaciones de Clean Architecture / DDD definidas en CLAUDE.md
            4. Uso de `any` en TypeScript
            5. Casos borde y manejo de errores
            6. Cobertura de tests

            Termina con un comentario resumen:
            - Veredicto: ✅ Listo para merge / ⚠️ Cambios menores / ❌ Requiere cambios
            - Lista de hallazgos por severidad